name: Compatibility Deployment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      pr_repo:
        required: false
        type: string
        default: 'deployment'
      pr_sha:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resolve-compatibility:
    name: resolve-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deployment_sha: ${{ steps.resolver.outputs.deployment_sha }}
      common_sha: ${{ steps.resolver.outputs.common_sha }}
      backend_sha: ${{ steps.resolver.outputs.backend_sha }}
      dashboard_sha: ${{ steps.resolver.outputs.dashboard_sha }}
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out base manifest from opsnexus-docs main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OpsNexusHQ/opsnexus-docs
          ref: main
          path: ci-source/opsnexus-docs
          persist-credentials: false

      - name: Resolve compatibility set
        id: resolver
        shell: bash
        run: |
          set -euo pipefail
          repo_arg="${{ inputs.pr_repo || 'deployment' }}"
          sha_arg="${{ inputs.pr_sha || github.event.pull_request.head.sha || github.sha }}"
          python3 .github/scripts/resolve_compatibility_set.py \
            --manifest ci-source/opsnexus-docs/engineering/releases/platform-compatibility.yaml \
            --pr-repo "$repo_arg" \
            --pr-sha "$sha_arg" \
            --github-output "$GITHUB_OUTPUT"

  compatibility-deployment:
    name: ci/compatibility-deployment
    needs: resolve-compatibility
    uses: ./.github/workflows/ci-deployment-validation.yml
    with:
      deployment_sha: ${{ needs.resolve-compatibility.outputs.deployment_sha }}
      common_sha: ${{ needs.resolve-compatibility.outputs.common_sha }}
      backend_sha: ${{ needs.resolve-compatibility.outputs.backend_sha }}
      dashboard_sha: ${{ needs.resolve-compatibility.outputs.dashboard_sha }}
      run_contract_assertions: true
      contract_profile: contract-basic
