name: Compatibility Contract

on:
  pull_request:
    branches: [main]
    paths:
      - .github/compatibility/contract-basic.json
      - .github/scripts/validate-contract-basic.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-contract:
    name: ci/compatibility-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out deployment contract definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out authoritative API contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OpsNexusHQ/opsnexus-api
          ref: 5c25b39547d30a57f07640a79115ca5f43b9544f
          path: "$RUNNER_TEMP/opsnexus-api"
          persist-credentials: false
      - name: Validate contract-covered assertion specification
        run: bash .github/scripts/validate-contract-basic.sh .github/compatibility/contract-basic.json "$RUNNER_TEMP/opsnexus-api/api/openapi.yaml"
