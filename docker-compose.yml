services:

  postgres:
    image: postgres:16-alpine
    container_name: opsnexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - opsnexus

  backend:
    build:
      context: ..
      dockerfile: opsnexus-deployment/backend/Dockerfile
    container_name: opsnexus-backend
    restart: unless-stopped
    environment:
      OPSNEXUS_HOST: ${OPSNEXUS_HOST}
      OPSNEXUS_PORT: ${OPSNEXUS_PORT}
      OPSNEXUS_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      OPSNEXUS_TELEMETRY_RETENTION: ${OPSNEXUS_TELEMETRY_RETENTION}
      OPSNEXUS_API_AUTH_ENABLED: ${OPSNEXUS_API_AUTH_ENABLED}
      OPSNEXUS_CORS_ORIGINS: ${OPSNEXUS_CORS_ORIGINS}
    ports:
      - "${OPSNEXUS_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - opsnexus

  dashboard:
    build:
      context: ..
      dockerfile: opsnexus-deployment/dashboard/Dockerfile
    container_name: opsnexus-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - opsnexus

volumes:
  postgres_data:

networks:
  opsnexus:
    driver: bridge
